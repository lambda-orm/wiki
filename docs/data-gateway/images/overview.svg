<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Data Gateway: who uses it, through which transport, and what it reaches</title>
  <style>
    .bg { fill: #ffffff }
    .t { fill: #111827 } .s { fill: #4b5563 }
    .client { fill: #eef2ff; stroke: #6366f1 }
    .gw { fill: #f8fafc; stroke: #2563eb } .gwt { fill: #1e3a8a }
    .tr { fill: #dbeafe; stroke: #2563eb }
    .core { fill: #ffffff; stroke: #93c5fd }
    .schema { fill: #ecfdf5; stroke: #10b981 }
    .db { fill: #fff7ed; stroke: #f97316 }
    .ln { stroke: #6b7280 } .hd { fill: #6b7280 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a } .t { fill: #e5e7eb } .s { fill: #9ca3af }
      .client { fill: #1e1b4b; stroke: #818cf8 }
      .gw { fill: #111827; stroke: #60a5fa } .gwt { fill: #93c5fd }
      .tr { fill: #1e3a8a; stroke: #60a5fa }
      .core { fill: #0f172a; stroke: #3b82f6 }
      .schema { fill: #064e3b; stroke: #34d399 }
      .db { fill: #431407; stroke: #fb923c }
      .ln { stroke: #9ca3af } .hd { fill: #9ca3af }
    }
  </style>
  <rect class="bg" width="1000" height="480"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="hd" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <!-- who uses it -->
  <g font-size="14">
    <rect class="client" x="16" y="44" width="190" height="66" rx="8"/>
    <text class="t" x="111" y="71" text-anchor="middle" font-weight="700">Applications</text>
    <text class="s" x="111" y="92" text-anchor="middle" font-size="12">@lambdaorm/client, curl, any HTTP</text>
    <rect class="client" x="16" y="140" width="190" height="66" rx="8"/>
    <text class="t" x="111" y="167" text-anchor="middle" font-weight="700">AI agents</text>
    <text class="s" x="111" y="188" text-anchor="middle" font-size="12">Claude Code, any MCP client</text>
    <rect class="client" x="16" y="236" width="190" height="66" rx="8"/>
    <text class="t" x="111" y="263" text-anchor="middle" font-weight="700">Real-time apps</text>
    <text class="s" x="111" y="284" text-anchor="middle" font-size="12">one connection, notifications</text>
    <rect class="client" x="16" y="332" width="190" height="66" rx="8"/>
    <text class="t" x="111" y="359" text-anchor="middle" font-weight="700">People</text>
    <text class="s" x="111" y="380" text-anchor="middle" font-size="12">Data Gateway IDE, Swagger UI</text>
  </g>

  <!-- the gateway -->
  <rect class="gw" x="270" y="16" width="440" height="448" rx="12" stroke-width="2"/>
  <text class="gwt" x="490" y="44" text-anchor="middle" font-size="18" font-weight="700">Data Gateway</text>
  <g font-size="13">
    <rect class="tr" x="288" y="57" width="168" height="44" rx="6"/>
    <text class="t" x="372" y="76" text-anchor="middle" font-weight="600">http · REST</text>
    <text class="s" x="372" y="93" text-anchor="middle" font-size="11">OpenAPI · /doc (Swagger)</text>
    <rect class="tr" x="288" y="151" width="168" height="44" rx="6"/>
    <text class="t" x="372" y="170" text-anchor="middle" font-weight="600">mcpHttp · mcpWebSocket</text>
    <text class="s" x="372" y="187" text-anchor="middle" font-size="11">MCP tools</text>
    <rect class="tr" x="288" y="247" width="168" height="44" rx="6"/>
    <text class="t" x="372" y="266" text-anchor="middle" font-weight="600">webSocket</text>
    <text class="s" x="372" y="283" text-anchor="middle" font-size="11">JSON-RPC</text>
    <rect class="tr" x="288" y="343" width="168" height="44" rx="6"/>
    <text class="t" x="372" y="362" text-anchor="middle" font-weight="600">management</text>
    <text class="s" x="372" y="379" text-anchor="middle" font-size="11">administration · sessions</text>

    <rect class="core" x="476" y="57" width="216" height="390" rx="8"/>
    <text class="t" x="584" y="82" text-anchor="middle" font-weight="700">credential → permissions</text>
    <text class="s" x="584" y="99" text-anchor="middle" font-size="11">read · write · script · queue · admin</text>
    <text class="s" x="584" y="114" text-anchor="middle" font-size="11">rate limit · concurrency</text>
    <rect class="schema" x="496" y="128" width="176" height="46" rx="6"/>
    <text class="t" x="584" y="148" text-anchor="middle" font-weight="600">schema northwind</text>
    <text class="s" x="584" y="164" text-anchor="middle" font-size="11">its own worker</text>
    <rect class="schema" x="496" y="184" width="176" height="46" rx="6"/>
    <text class="t" x="584" y="204" text-anchor="middle" font-weight="600">schema iot/v2</text>
    <text class="s" x="584" y="220" text-anchor="middle" font-size="11">its own worker</text>
    <rect class="schema" x="496" y="240" width="176" height="46" rx="6"/>
    <text class="t" x="584" y="260" text-anchor="middle" font-weight="600">schema accounts</text>
    <text class="s" x="584" y="276" text-anchor="middle" font-size="11">its own worker</text>
    <text class="t" x="584" y="314" text-anchor="middle" font-size="12" font-weight="600">λORM</text>
    <text class="s" x="584" y="332" text-anchor="middle" font-size="11">lambda queries · views · context</text>
    <text class="s" x="584" y="348" text-anchor="middle" font-size="11">across sources · in memory</text>
    <text class="s" x="584" y="380" text-anchor="middle" font-size="11">audit · metrics · health</text>
    <text class="s" x="584" y="396" text-anchor="middle" font-size="11">OpenTelemetry</text>
    <text class="s" x="584" y="424" text-anchor="middle" font-size="11">hot reload of the workspace</text>
  </g>

  <!-- what it reaches -->
  <g font-size="13">
    <rect class="db" x="780" y="52" width="204" height="46" rx="8"/>
    <text class="t" x="882" y="80" text-anchor="middle" font-weight="600">PostgreSQL · MySQL · MariaDB</text>
    <rect class="db" x="780" y="122" width="204" height="46" rx="8"/>
    <text class="t" x="882" y="150" text-anchor="middle" font-weight="600">SQL Server · Oracle</text>
    <rect class="db" x="780" y="192" width="204" height="46" rx="8"/>
    <text class="t" x="882" y="220" text-anchor="middle" font-weight="600">MongoDB · SQLite</text>
    <rect class="db" x="780" y="262" width="204" height="46" rx="8"/>
    <text class="t" x="882" y="283" text-anchor="middle" font-weight="600">REST APIs</text>
    <text class="s" x="882" y="299" text-anchor="middle" font-size="11">Http sources · OAuth2</text>
    <rect class="db" x="780" y="332" width="204" height="46" rx="8"/>
    <text class="t" x="882" y="353" text-anchor="middle" font-weight="600">Kafka</text>
    <text class="s" x="882" y="369" text-anchor="middle" font-size="11">queued executions</text>
  </g>

  <g class="ln" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M206 77H286"/><path d="M206 173H286"/><path d="M206 269H286"/><path d="M206 365H286"/>
    <path d="M456 79H474"/><path d="M456 173H474"/><path d="M456 269H474"/><path d="M456 365H474"/>
    <path d="M692 151L778 77"/><path d="M692 207L778 145"/><path d="M692 263L778 215"/><path d="M692 263L778 285"/><path d="M692 330L778 355"/>
  </g>
</svg>
