<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Data Gateway: who uses it and what it reaches</title>
  <rect width="960" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <!-- clients -->
  <g font-size="14">
    <rect x="20" y="40" width="170" height="64" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="105" y="67" text-anchor="middle" font-weight="700">Applications</text>
    <text x="105" y="88" text-anchor="middle" font-size="12" fill="#4b5563">@lambdaorm/client, curl, any</text>
    <rect x="20" y="130" width="170" height="64" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="105" y="157" text-anchor="middle" font-weight="700">AI agents</text>
    <text x="105" y="178" text-anchor="middle" font-size="12" fill="#4b5563">Claude Code, MCP clients</text>
    <rect x="20" y="220" width="170" height="64" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="105" y="247" text-anchor="middle" font-weight="700">Real-time apps</text>
    <text x="105" y="268" text-anchor="middle" font-size="12" fill="#4b5563">one connection, notifications</text>
    <rect x="20" y="310" width="170" height="64" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="105" y="337" text-anchor="middle" font-weight="700">People</text>
    <text x="105" y="358" text-anchor="middle" font-size="12" fill="#4b5563">the web UI, Swagger</text>
  </g>
  <!-- gateway -->
  <rect x="280" y="20" width="400" height="400" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="48" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Data Gateway</text>
  <g font-size="13">
    <rect x="300" y="64" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="375" y="89" text-anchor="middle" font-weight="600">http · REST</text>
    <rect x="300" y="154" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="375" y="179" text-anchor="middle" font-weight="600">mcpHttp · MCP</text>
    <rect x="300" y="244" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="375" y="269" text-anchor="middle" font-weight="600">webSocket · JSON-RPC</text>
    <rect x="300" y="334" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="375" y="359" text-anchor="middle" font-weight="600">http · /ui, /doc</text>
    <rect x="470" y="64" width="190" height="310" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="565" y="90" text-anchor="middle" font-weight="700">credential → permissions</text>
    <text x="565" y="108" text-anchor="middle" font-size="11" fill="#4b5563">read · write · script</text><text x="565" y="122" text-anchor="middle" font-size="11" fill="#4b5563">queue · stageImport</text>
    <rect x="490" y="134" width="150" height="44" rx="6" fill="#ecfdf5" stroke="#10b981"/><text x="565" y="154" text-anchor="middle" font-weight="600">schema iot/v1</text><text x="565" y="170" text-anchor="middle" font-size="11" fill="#4b5563">its own worker</text>
    <rect x="490" y="190" width="150" height="44" rx="6" fill="#ecfdf5" stroke="#10b981"/><text x="565" y="210" text-anchor="middle" font-weight="600">schema iot/v2</text><text x="565" y="226" text-anchor="middle" font-size="11" fill="#4b5563">its own worker</text>
    <rect x="490" y="250" width="150" height="44" rx="6" fill="#ecfdf5" stroke="#10b981"/><text x="565" y="270" text-anchor="middle" font-weight="600">schema accounts</text><text x="565" y="286" text-anchor="middle" font-size="11" fill="#4b5563">its own worker</text>
    <text x="565" y="320" text-anchor="middle" font-size="12" fill="#4b5563">λORM: lambda queries</text>
    <text x="565" y="338" text-anchor="middle" font-size="12" fill="#4b5563">audit · metrics · health</text>
  </g>
  <!-- databases -->
  <g font-size="13">
    <rect x="770" y="80" width="170" height="44" rx="8" fill="#fff7ed" stroke="#f97316"/><text x="855" y="107" text-anchor="middle" font-weight="600">PostgreSQL · MySQL</text>
    <rect x="770" y="150" width="170" height="44" rx="8" fill="#fff7ed" stroke="#f97316"/><text x="855" y="177" text-anchor="middle" font-weight="600">SQL Server · Oracle</text>
    <rect x="770" y="220" width="170" height="44" rx="8" fill="#fff7ed" stroke="#f97316"/><text x="855" y="247" text-anchor="middle" font-weight="600">MongoDB · MariaDB</text>
    <rect x="770" y="290" width="170" height="44" rx="8" fill="#fff7ed" stroke="#f97316"/><text x="855" y="317" text-anchor="middle" font-weight="600">Kafka (queued)</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M190 72H298"/><path d="M190 162H298"/><path d="M190 252H298"/><path d="M190 342H298"/>
    <path d="M450 84H468"/><path d="M450 174H468"/><path d="M450 264H468"/><path d="M450 354H468"/>
    <path d="M640 152L768 102"/><path d="M640 212L768 172"/><path d="M640 272L768 242"/><path d="M640 272L768 312"/>
  </g>
</svg>
