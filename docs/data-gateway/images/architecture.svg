<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Data Gateway: supervisor, edge worker and schema workers</title>
  <style>
    .bg { fill: #ffffff }
    .t { fill: #111827 } .s { fill: #374151 } .m { fill: #6b7280 }
    .sup { fill: #f1f5f9; stroke: #475569 }
    .edge { fill: #eff6ff; stroke: #2563eb } .edget { fill: #1e3a8a }
    .port { fill: #dbeafe; stroke: #2563eb }
    .mgmt { fill: #ede9fe; stroke: #7c3aed }
    .ok { fill: #ecfdf5; stroke: #10b981 } .okt { fill: #065f46 }
    .err { fill: #fef2f2; stroke: #ef4444 } .errt { fill: #991b1b }
    .db { fill: #fff7ed; stroke: #f97316 } .dbtop { fill: #ffedd5; stroke: #f97316 } .dbl { stroke: #9a3412 } .svc { fill: #f8fafc; stroke: #94a3b8 }
    .ws { fill: #fefce8; stroke: #ca8a04 }
    .ln { stroke: #6b7280 } .hd { fill: #6b7280 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a } .t { fill: #e5e7eb } .s { fill: #d1d5db } .m { fill: #9ca3af }
      .sup { fill: #1e293b; stroke: #94a3b8 }
      .edge { fill: #172554; stroke: #60a5fa } .edget { fill: #93c5fd }
      .port { fill: #1e3a8a; stroke: #60a5fa }
      .mgmt { fill: #2e1065; stroke: #a78bfa }
      .ok { fill: #064e3b; stroke: #34d399 } .okt { fill: #6ee7b7 }
      .err { fill: #450a0a; stroke: #f87171 } .errt { fill: #fca5a5 }
      .db { fill: #431407; stroke: #fb923c } .dbtop { fill: #7c2d12; stroke: #fb923c } .dbl { stroke: #fdba74 } .svc { fill: #1e293b; stroke: #94a3b8 }
      .ws { fill: #422006; stroke: #facc15 }
      .ln { stroke: #9ca3af } .hd { fill: #9ca3af }
    }
  </style>
  <rect class="bg" width="1000" height="540"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="hd" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <!-- supervisor -->
  <rect class="sup" x="300" y="16" width="400" height="78" rx="10" stroke-width="1.5"/>
  <text class="t" x="500" y="42" text-anchor="middle" font-size="16" font-weight="700">Supervisor (main thread)</text>
  <text class="s" x="500" y="62" text-anchor="middle" font-size="12">reads the configuration · starts and watches the workers</text>
  <text class="s" x="500" y="80" text-anchor="middle" font-size="12">heartbeat · restarts · states · no network, no queries</text>

  <!-- workspace watcher -->
  <rect class="ws" x="740" y="24" width="244" height="62" rx="10" stroke-width="1.5"/>
  <text class="t" x="862" y="48" text-anchor="middle" font-size="14" font-weight="700">Workspace watcher</text>
  <text class="s" x="862" y="68" text-anchor="middle" font-size="11">a changed schema: hot reload, blue-green</text>

  <!-- edge -->
  <rect class="edge" x="24" y="140" width="380" height="250" rx="10" stroke-width="1.5"/>
  <text class="edget" x="214" y="166" text-anchor="middle" font-size="16" font-weight="700">Edge worker</text>
  <g font-size="12">
    <rect class="port" x="44" y="180" width="164" height="30" rx="5"/><text class="t" x="126" y="200" text-anchor="middle">http :8080</text>
    <rect class="port" x="220" y="180" width="164" height="30" rx="5"/><text class="t" x="302" y="200" text-anchor="middle">mcpHttp :8081</text>
    <rect class="port" x="44" y="218" width="164" height="30" rx="5"/><text class="t" x="126" y="238" text-anchor="middle">mcpWebSocket :8082</text>
    <rect class="port" x="220" y="218" width="164" height="30" rx="5"/><text class="t" x="302" y="238" text-anchor="middle">webSocket :8083</text>
    <rect class="mgmt" x="44" y="256" width="340" height="30" rx="5"/><text class="t" x="214" y="276" text-anchor="middle">management :9090 · administration · sessions</text>
    <text class="s" x="214" y="310" text-anchor="middle">1 · authenticate the credential</text>
    <text class="s" x="214" y="328" text-anchor="middle">2 · rate limit · simultaneous operations</text>
    <text class="s" x="214" y="346" text-anchor="middle">3 · find the schema by the route</text>
    <text class="m" x="214" y="372" text-anchor="middle">(the secret never leaves the edge)</text>
  </g>

  <!-- IDE -->
  <rect class="mgmt" x="24" y="430" width="240" height="56" rx="10" stroke-width="1.5"/>
  <text class="t" x="144" y="454" text-anchor="middle" font-size="14" font-weight="700">Data Gateway IDE</text>
  <text class="s" x="144" y="474" text-anchor="middle" font-size="11">its own image · reaches management</text>

  <!-- schema workers -->
  <g font-size="12">
    <rect class="ok" x="580" y="130" width="396" height="96" rx="10" stroke-width="1.5"/>
    <text class="okt" x="778" y="154" text-anchor="middle" font-size="15" font-weight="700">Schema worker · northwind</text>
    <text class="s" x="778" y="174" text-anchor="middle">4 · authorize (permissions, view) · 5 · λORM runs the query</text>
    <text class="s" x="778" y="192" text-anchor="middle">its env · its connection pools · its queue · its MCP tools</text>
    <text class="s" x="778" y="210" text-anchor="middle">6 · audit the writes</text>
    <rect class="ok" x="580" y="240" width="396" height="56" rx="10" stroke-width="1.5"/>
    <text class="okt" x="778" y="264" text-anchor="middle" font-size="15" font-weight="700">Schema worker · iot/v2</text>
    <text class="s" x="778" y="284" text-anchor="middle">thread or process · restarted alone if it falls</text>
    <rect class="err" x="580" y="310" width="396" height="56" rx="10" stroke-width="1.5"/>
    <text class="errt" x="778" y="334" text-anchor="middle" font-size="15" font-weight="700">Schema worker · accounts (error)</text>
    <text class="s" x="778" y="354" text-anchor="middle">database down → 503 · retried with a growing wait</text>
  </g>

  <!-- sources: the databases as cylinders, the REST API as a service -->
  <g font-size="12">
    <g stroke-width="1.8">
      <path class="db" d="M609 428V472A46 9 0 0 0 701 472V428"/>
      <path class="dbl" d="M609 443A46 9 0 0 0 701 443M609 458A46 9 0 0 0 701 458" fill="none" stroke-width="1.2" opacity="0.6"/>
      <ellipse class="dbtop" cx="655" cy="428" rx="46" ry="9"/>
    </g>
    <text class="t" x="655" y="456" text-anchor="middle" font-weight="700">PostgreSQL</text>
    <g stroke-width="1.8">
      <path class="db" d="M731 428V472A46 9 0 0 0 823 472V428"/>
      <path class="dbl" d="M731 443A46 9 0 0 0 823 443M731 458A46 9 0 0 0 823 458" fill="none" stroke-width="1.2" opacity="0.6"/>
      <ellipse class="dbtop" cx="777" cy="428" rx="46" ry="9"/>
    </g>
    <text class="t" x="777" y="456" text-anchor="middle" font-weight="700">MongoDB</text>
    <rect class="svc" x="849" y="420" width="100" height="58" rx="8"/>
    <g class="dbl" fill="none" stroke-width="1.6" stroke-linecap="round"><circle cx="899" cy="439" r="9"/><path d="M890 439H908M899 430c-4 4-4 14 0 18M899 430c4 4 4 14 0 18"/></g>
    <text class="t" x="899" y="468" text-anchor="middle" font-weight="600">REST API</text>
  </g>

  <g class="ln" stroke-width="1.5" fill="none">
    <path d="M390 94L260 138" stroke-dasharray="5 4" marker-end="url(#b)"/>
    <path d="M610 94L740 128" stroke-dasharray="5 4" marker-end="url(#b)"/>
    <path d="M740 60H702" stroke-dasharray="5 4" marker-end="url(#b)"/>
    <path d="M406 200H578" marker-end="url(#b)"/>
    <path d="M406 240C490 240 500 268 578 268" marker-end="url(#b)"/>
    <path d="M406 300C490 300 500 338 578 338" marker-end="url(#b)"/>
    <path d="M144 430V388" marker-end="url(#b)"/>
    <path d="M655 366V416" marker-end="url(#b)"/>
    <path d="M777 366V416" marker-end="url(#b)"/>
    <path d="M899 366V418" marker-end="url(#b)"/>
  </g>
  <text class="m" x="492" y="190" text-anchor="middle" font-size="11">a direct channel per schema</text>
  <text class="m" x="500" y="116" text-anchor="middle" font-size="11">starts · watches · restarts</text>
  <text class="m" x="912" y="402" font-size="11">each worker,</text><text class="m" x="912" y="416" font-size="11">its own pools</text>
  <text class="s" x="290" y="506" font-size="12">A credential with read can query, never write — by any transport.</text>
  <text class="s" x="290" y="526" font-size="12">A heavy query on northwind doesn't stop iot/v2; a fallen worker is restarted alone.</text>
</svg>
