<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>An application queries the domain; λORM's stage sends Countries to a MySQL database and States, through its mapping, to a PostgreSQL database</title>
  <style>
    .bg { fill: #ffffff } .t { fill: #111827 } .s { fill: #4b5563 } .m { fill: #6b7280 }
    .app { fill: #f1f5f9; stroke: #64748b } .appi { fill: #e2e8f0; stroke: #64748b } .code { fill: #0f172a }
    .dom { fill: #eef2ff; stroke: #6366f1 } .domt { fill: #3730a3 } .chip { fill: #ffffff; stroke: #a5b4fc } .domi { fill: #6366f1 }
    .abs { fill: #ffffff; stroke: #8b5cf6; stroke-dasharray: 5 3 }
    .inf { fill: #fffbeb; stroke: #d97706 } .inft { fill: #92400e } .ichip { fill: #ffffff; stroke: #fcd34d } .infi { fill: #d97706 }
    .orm { fill: #ecfdf5; stroke: #10b981 } .ormt { fill: #065f46 } .ormi { fill: #10b981 }
    .db { fill: #fff7ed; stroke: #f97316 } .dbtop { fill: #ffedd5; stroke: #f97316 } .dbt { fill: #9a3412 }
    .tbl { fill: #ffffff; stroke: #fdba74 } .key { fill: #c2410c }
    .ln { stroke: #64748b } .hd { fill: #64748b } .ext { stroke: #8b5cf6 } .exth { fill: #8b5cf6 } .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a } .t { fill: #e5e7eb } .s { fill: #9ca3af } .m { fill: #9ca3af }
      .app { fill: #1e293b; stroke: #94a3b8 } .appi { fill: #334155; stroke: #94a3b8 } .code { fill: #e2e8f0 }
      .dom { fill: #1e1b4b; stroke: #818cf8 } .domt { fill: #a5b4fc } .chip { fill: #0f172a; stroke: #6366f1 } .domi { fill: #818cf8 }
      .abs { fill: #0f172a; stroke: #a78bfa }
      .inf { fill: #422006; stroke: #f59e0b } .inft { fill: #fcd34d } .ichip { fill: #0f172a; stroke: #b45309 } .infi { fill: #f59e0b }
      .orm { fill: #064e3b; stroke: #34d399 } .ormt { fill: #6ee7b7 } .ormi { fill: #34d399 }
      .db { fill: #431407; stroke: #fb923c } .dbtop { fill: #7c2d12; stroke: #fb923c } .dbt { fill: #fdba74 }
      .tbl { fill: #0f172a; stroke: #c2410c } .key { fill: #fb923c }
      .ln { stroke: #94a3b8 } .hd { fill: #94a3b8 } .ext { stroke: #a78bfa } .exth { fill: #a78bfa }
    }
  </style>
  <rect class="bg" width="1040" height="620"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="hd" d="M0 0L10 5L0 10z"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="exth" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <!-- the application: a service window -->
  <rect class="app" x="16" y="16" width="440" height="78" rx="12"/>
  <rect class="appi" x="32" y="32" width="46" height="34" rx="5"/>
  <path class="ln icon" d="M32 42H78M40 37h.01M46 37h.01M52 37h.01"/>
  <path class="ln icon" d="M46 51l-5 5 5 5M64 51l5 5-5 5"/>
  <text class="t" x="92" y="42" font-size="14" font-weight="700">Your application</text>
  <text class="m" x="92" y="58" font-size="11">Node.js · the CLI · the Data Gateway</text>
  <text class="code" x="32" y="84" font-size="13" font-family="ui-monospace, Menlo, monospace">States.include(p =&gt; p.country)</text>

  <!-- domain -->
  <rect class="dom" x="16" y="112" width="440" height="290" rx="12"/>
  <g class="domi">
    <rect x="34" y="128" width="9" height="9" rx="2"/><rect x="47" y="128" width="9" height="9" rx="2"/><rect x="34" y="141" width="9" height="9" rx="2"/><rect x="47" y="141" width="9" height="9" rx="2"/>
  </g>
  <text class="domt" x="66" y="146" font-size="16" font-weight="700">domain</text>
  <text class="s" x="140" y="146" font-size="12">the same for both databases</text>
  <g font-size="12">
    <rect class="abs" x="34" y="164" width="404" height="48" rx="8"/>
    <text class="t" x="50" y="183" font-weight="700">Positions</text>
    <text class="m" x="422" y="183" text-anchor="end" font-size="11">abstract</text>
    <text class="s" x="50" y="201">latitude · longitude</text>
    <rect class="chip" x="34" y="242" width="194" height="142" rx="8"/>
    <text class="t" x="50" y="264" font-weight="700">Countries</text>
    <text class="s" x="50" y="286">iso3 · key</text>
    <text class="s" x="50" y="304">name</text>
    <text class="s" x="50" y="322">region · subregion</text>
    <text class="m" x="50" y="340" font-style="italic">states → States</text>
    <text class="m" x="50" y="366" font-size="11">+ latitude · longitude</text>
    <rect class="chip" x="244" y="242" width="194" height="142" rx="8"/>
    <text class="t" x="260" y="264" font-weight="700">States</text>
    <text class="s" x="260" y="286">id · key</text>
    <text class="s" x="260" y="304">name</text>
    <text class="s" x="260" y="322">countryCode</text>
    <text class="m" x="260" y="340" font-style="italic">country → Countries</text>
    <text class="m" x="260" y="366" font-size="11">+ latitude · longitude</text>
  </g>
  <g class="ext" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#e)">
    <path d="M131 242V214"/><path d="M341 242V214"/>
  </g>
  <text class="m" x="236" y="232" text-anchor="middle" font-size="10">extends</text>

  <!-- mapping -->
  <rect class="inf" x="16" y="420" width="440" height="184" rx="12"/>
  <path class="infi" d="M34 438l10-4 10 4 10-4v16l-10 4-10-4-10 4z" opacity="0.9"/>
  <text class="inft" x="74" y="452" font-size="16" font-weight="700">mapping2</text>
  <text class="s" x="34" y="476" font-size="12">only what differs from the domain is written</text>
  <g font-size="11" font-family="ui-monospace, Menlo, monospace">
    <rect class="ichip" x="34" y="488" width="404" height="100" rx="8"/>
    <text class="t" x="50" y="510" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">States → TBL_STATES</text>
    <text class="s" x="50" y="532">id → ID</text><text class="s" x="210" y="532">countryCode → COUNTRY_CODE</text>
    <text class="s" x="50" y="550">name → NAME</text><text class="s" x="210" y="550">latitude → LATITUDE</text>
    <text class="s" x="210" y="568">longitude → LONGITUDE</text>
  </g>

  <!-- λORM: the stage, a router -->
  <rect class="orm" x="488" y="226" width="214" height="176" rx="14"/>
  <circle class="ormi" cx="512" cy="252" r="13"/>
  <text x="512" y="257" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">λ</text>
  <text class="ormt" x="534" y="250" font-size="15" font-weight="700">λORM · stage1</text>
  <text class="s" x="534" y="266" font-size="11">routes each sentence</text>
  <text class="t" x="504" y="300" font-size="12" font-family="ui-monospace, Menlo, monospace">entity == "States"</text>
  <text class="s" x="516" y="318" font-size="12">→ dataSource2</text>
  <text class="t" x="504" y="346" font-size="12" font-family="ui-monospace, Menlo, monospace">the rest</text>
  <text class="s" x="516" y="364" font-size="12">→ dataSource1</text>
  <text class="m" x="504" y="390" font-size="10">joins the two results</text>

  <!-- MySQL: a database cylinder -->
  <path class="db" d="M744 46V286A136 18 0 0 0 1016 286V46" stroke-width="1.5"/>
  <ellipse class="dbtop" cx="880" cy="46" rx="136" ry="18" stroke-width="1.5"/>
  <text class="dbt" x="880" y="86" text-anchor="middle" font-size="15" font-weight="700">MySQL</text>
  <text class="s" x="880" y="103" text-anchor="middle" font-size="11">dataSource1 · mapping1: the domain names</text>
  <g font-size="12">
    <rect class="tbl" x="790" y="116" width="180" height="156" rx="8"/>
    <text class="t" x="806" y="138" font-weight="700">Countries</text>
    <text class="key" x="806" y="160" font-size="10" font-weight="700">PK</text><text class="t" x="832" y="160" font-weight="600">iso3</text>
    <text class="key" x="806" y="178" font-size="10" font-weight="700">UK</text><text class="t" x="832" y="178">name</text>
    <text class="t" x="832" y="196">region</text>
    <text class="t" x="832" y="214">subregion</text>
    <text class="t" x="832" y="232">latitude</text>
    <text class="t" x="832" y="250">longitude</text>
  </g>

  <!-- PostgreSQL: a database cylinder -->
  <path class="db" d="M744 342V582A136 18 0 0 0 1016 582V342" stroke-width="1.5"/>
  <ellipse class="dbtop" cx="880" cy="342" rx="136" ry="18" stroke-width="1.5"/>
  <text class="dbt" x="880" y="382" text-anchor="middle" font-size="15" font-weight="700">PostgreSQL</text>
  <text class="s" x="880" y="399" text-anchor="middle" font-size="11">dataSource2 · mapping2</text>
  <g font-size="12">
    <rect class="tbl" x="790" y="412" width="180" height="138" rx="8"/>
    <text class="t" x="806" y="434" font-weight="700">TBL_STATES</text>
    <text class="key" x="806" y="456" font-size="10" font-weight="700">PK</text><text class="t" x="832" y="456" font-weight="600">ID</text>
    <text class="t" x="832" y="474">COUNTRY_CODE</text>
    <text class="t" x="832" y="492">NAME</text>
    <text class="t" x="832" y="510">LATITUDE</text>
    <text class="t" x="832" y="528">LONGITUDE</text>
  </g>

  <g class="ln" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M456 56C560 56 595 120 595 224"/>
    <path d="M456 300H486"/>
    <path d="M640 226C640 170 690 170 742 170"/>
    <path d="M640 402C640 460 690 466 742 466"/>
    <path d="M456 512C580 512 640 520 742 520" stroke-dasharray="4 3"/>
  </g>
  <text class="m" x="600" y="508" text-anchor="middle" font-size="10">names its tables and columns</text>
  <text class="m" x="500" y="48" font-size="10">the query</text>
</svg>
