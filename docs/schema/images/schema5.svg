<svg xmlns="http://www.w3.org/2000/svg" width="980" height="466" viewBox="0 0 980 466" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>One stage, two sources, each with its mapping: Countries on MySQL, TBL_STATES on PostgreSQL</title>

