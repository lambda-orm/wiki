<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>One stage, two sources: Countries on MySQL with the domain names, States on PostgreSQL as TBL_STATES through its mapping</title>
  <style>
    .bg { fill: #ffffff } .t { fill: #111827 } .s { fill: #4b5563 } .m { fill: #6b7280 }
    .q { fill: #f1f5f9; stroke: #64748b } .code { fill: #0f172a }
    .dom { fill: #eef2ff; stroke: #6366f1 } .domt { fill: #3730a3 } .chip { fill: #ffffff; stroke: #a5b4fc }
    .abs { fill: #ffffff; stroke: #8b5cf6; stroke-dasharray: 5 3 }
    .inf { fill: #fffbeb; stroke: #d97706 } .inft { fill: #92400e } .ichip { fill: #ffffff; stroke: #fcd34d }
    .stg { fill: #ecfdf5; stroke: #10b981 } .stgt { fill: #065f46 }
    .src { fill: #fff7ed; stroke: #f97316 } .srct { fill: #9a3412 } .tbl { fill: #ffffff; stroke: #fdba74 } .key { fill: #c2410c }
    .ln { stroke: #64748b } .hd { fill: #64748b } .ext { stroke: #8b5cf6 } .exth { fill: #8b5cf6 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a } .t { fill: #e5e7eb } .s { fill: #9ca3af } .m { fill: #9ca3af }
      .q { fill: #1e293b; stroke: #94a3b8 } .code { fill: #e2e8f0 }
      .dom { fill: #1e1b4b; stroke: #818cf8 } .domt { fill: #a5b4fc } .chip { fill: #0f172a; stroke: #6366f1 }
      .abs { fill: #0f172a; stroke: #a78bfa }
      .inf { fill: #422006; stroke: #f59e0b } .inft { fill: #fcd34d } .ichip { fill: #0f172a; stroke: #b45309 }
      .stg { fill: #064e3b; stroke: #34d399 } .stgt { fill: #6ee7b7 }
      .src { fill: #431407; stroke: #fb923c } .srct { fill: #fdba74 } .tbl { fill: #0f172a; stroke: #c2410c } .key { fill: #fb923c }
      .ln { stroke: #94a3b8 } .hd { fill: #94a3b8 } .ext { stroke: #a78bfa } .exth { fill: #a78bfa }
    }
  </style>
  <rect class="bg" width="1000" height="600"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="hd" d="M0 0L10 5L0 10z"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="exth" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <!-- the query -->
  <rect class="q" x="16" y="16" width="420" height="54" rx="10"/>
  <text class="m" x="34" y="38" font-size="11">one query, two databases</text>
  <text class="code" x="34" y="58" font-size="14" font-family="ui-monospace, Menlo, monospace">States.include(p =&gt; p.country)</text>

  <!-- domain -->
  <rect class="dom" x="16" y="90" width="420" height="300" rx="12"/>
  <text class="domt" x="36" y="118" font-size="16" font-weight="700">domain</text>
  <text class="s" x="36" y="137" font-size="12">the same for both sources</text>
  <g font-size="12">
    <rect class="abs" x="36" y="152" width="380" height="50" rx="8"/>
    <text class="t" x="52" y="172" font-weight="700">Positions</text>
    <text class="m" x="400" y="172" text-anchor="end" font-size="11">abstract</text>
    <text class="s" x="52" y="191">latitude · longitude</text>
    <rect class="chip" x="36" y="230" width="182" height="140" rx="8"/>
    <text class="t" x="52" y="252" font-weight="700">Countries</text>
    <text class="s" x="52" y="274">iso3 · key</text>
    <text class="s" x="52" y="292">name</text>
    <text class="s" x="52" y="310">region · subregion</text>
    <text class="m" x="52" y="328" font-style="italic">states → States</text>
    <text class="m" x="52" y="354" font-size="11">+ latitude · longitude</text>
    <rect class="chip" x="234" y="230" width="182" height="140" rx="8"/>
    <text class="t" x="250" y="252" font-weight="700">States</text>
    <text class="s" x="250" y="274">id · key</text>
    <text class="s" x="250" y="292">name</text>
    <text class="s" x="250" y="310">countryCode</text>
    <text class="m" x="250" y="328" font-style="italic">country → Countries</text>
    <text class="m" x="250" y="354" font-size="11">+ latitude · longitude</text>
  </g>
  <g class="ext" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#e)">
    <path d="M127 230V204"/><path d="M325 230V204"/>
  </g>
  <text class="m" x="226" y="221" text-anchor="middle" font-size="10">extends</text>

  <!-- mapping -->
  <rect class="inf" x="16" y="410" width="420" height="174" rx="12"/>
  <text class="inft" x="36" y="438" font-size="16" font-weight="700">mapping2</text>
  <text class="s" x="36" y="457" font-size="12">only what differs from the domain is written</text>
  <g font-size="11" font-family="ui-monospace, Menlo, monospace">
    <rect class="ichip" x="36" y="470" width="380" height="98" rx="8"/>
    <text class="t" x="52" y="492" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">States → TBL_STATES</text>
    <text class="s" x="52" y="514">id → ID</text><text class="s" x="210" y="514">countryCode → COUNTRY_CODE</text>
    <text class="s" x="52" y="532">name → NAME</text><text class="s" x="210" y="532">latitude → LATITUDE</text>
    <text class="s" x="210" y="550">longitude → LONGITUDE</text>
  </g>

  <!-- stage -->
  <rect class="stg" x="470" y="226" width="200" height="150" rx="12"/>
  <text class="stgt" x="490" y="254" font-size="16" font-weight="700">stage1</text>
  <text class="s" x="490" y="273" font-size="12">a rule per source, in order</text>
  <text class="t" x="490" y="304" font-size="12" font-family="ui-monospace, Menlo, monospace">entity == "States"</text>
  <text class="s" x="502" y="322" font-size="12">→ dataSource2</text>
  <text class="t" x="490" y="348" font-size="12" font-family="ui-monospace, Menlo, monospace">the rest</text>
  <text class="s" x="502" y="366" font-size="12">→ dataSource1</text>

  <!-- sources -->
  <rect class="src" x="704" y="90" width="280" height="236" rx="12"/>
  <text class="srct" x="724" y="118" font-size="16" font-weight="700">dataSource1 · MySQL</text>
  <text class="s" x="724" y="137" font-size="12">mapping1: the domain names</text>
  <g font-size="12">
    <rect class="tbl" x="724" y="152" width="240" height="156" rx="8"/>
    <text class="t" x="740" y="174" font-weight="700">Countries</text>
    <text class="key" x="740" y="196" font-size="10" font-weight="700">PK</text><text class="t" x="766" y="196" font-weight="600">iso3</text>
    <text class="key" x="740" y="214" font-size="10" font-weight="700">UK</text><text class="t" x="766" y="214">name</text>
    <text class="t" x="766" y="232">region</text>
    <text class="t" x="766" y="250">subregion</text>
    <text class="t" x="766" y="268">latitude</text>
    <text class="t" x="766" y="286">longitude</text>
  </g>
  <rect class="src" x="704" y="348" width="280" height="236" rx="12"/>
  <text class="srct" x="724" y="376" font-size="16" font-weight="700">dataSource2 · PostgreSQL</text>
  <text class="s" x="724" y="395" font-size="12">mapping2</text>
  <g font-size="12">
    <rect class="tbl" x="724" y="410" width="240" height="156" rx="8"/>
    <text class="t" x="740" y="432" font-weight="700">TBL_STATES</text>
    <text class="key" x="740" y="454" font-size="10" font-weight="700">PK</text><text class="t" x="766" y="454" font-weight="600">ID</text>
    <text class="t" x="766" y="472">COUNTRY_CODE</text>
    <text class="t" x="766" y="490">NAME</text>
    <text class="t" x="766" y="508">LATITUDE</text>
    <text class="t" x="766" y="526">LONGITUDE</text>
  </g>

  <g class="ln" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M436 300H468"/>
    <path d="M640 226C640 190 660 208 702 208"/>
    <path d="M640 376C640 430 660 466 702 466"/>
    <path d="M436 497C560 497 600 520 702 520" stroke-dasharray="4 3"/>
  </g>
  <text class="m" x="560" y="492" text-anchor="middle" font-size="10">names its tables and columns</text>
</svg>
