<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="614" viewBox="0 0 1080 614" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>An application queries the domain; λORM sends Countries to a MySQL database and States, through its mapping, to a PostgreSQL database</title>
  <style>
    .bg { fill: #ffffff } .t { fill: #111827 } .s { fill: #4b5563 } .m { fill: #6b7280 }
    .app { fill: #f1f5f9; stroke: #64748b } .code { fill: #0f172a }
    .dom { fill: #eef2ff; stroke: #6366f1 } .domt { fill: #3730a3 } .chip { fill: #ffffff; stroke: #a5b4fc } .domi { fill: #6366f1 }
    .abs { fill: #ffffff; stroke: #8b5cf6; stroke-dasharray: 5 3 }
    .inf { fill: #fffbeb; stroke: #d97706 } .inft { fill: #92400e } .ichip { fill: #ffffff; stroke: #fcd34d } .infi { fill: #d97706 }
    .orm { fill: #ecfdf5; stroke: #10b981 } .ormt { fill: #065f46 } .ormi { fill: #10b981 }
    .mysql { fill: #e0f2fe; stroke: #0369a1 } .mysqltop { fill: #bae6fd; stroke: #0369a1 } .mysqlt { fill: #075985 }
    .pg { fill: #e0e7ff; stroke: #3730a3 } .pgtop { fill: #c7d2fe; stroke: #3730a3 } .pgt { fill: #312e81 }
    .tbl { fill: #ffffff; stroke: #cbd5e1 } .tblh { fill: #f1f5f9 } .key { fill: #c2410c }
    .sch { fill: #f8fafc; stroke: #94a3b8 } .scht { fill: #334155 } .file { fill: #334155 }
    .ln { stroke: #64748b } .hd { fill: #64748b } .ext { stroke: #8b5cf6 } .exth { fill: #8b5cf6 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a } .t { fill: #e5e7eb } .s { fill: #9ca3af } .m { fill: #9ca3af }
      .app { fill: #1e293b; stroke: #94a3b8 } .code { fill: #e2e8f0 }
      .dom { fill: #1e1b4b; stroke: #818cf8 } .domt { fill: #a5b4fc } .chip { fill: #0f172a; stroke: #6366f1 } .domi { fill: #818cf8 }
      .abs { fill: #0f172a; stroke: #a78bfa }
      .inf { fill: #422006; stroke: #f59e0b } .inft { fill: #fcd34d } .ichip { fill: #0f172a; stroke: #b45309 } .infi { fill: #f59e0b }
      .orm { fill: #064e3b; stroke: #34d399 } .ormt { fill: #6ee7b7 } .ormi { fill: #34d399 }
      .mysql { fill: #0c4a6e; stroke: #38bdf8 } .mysqltop { fill: #075985; stroke: #38bdf8 } .mysqlt { fill: #e0f2fe }
      .pg { fill: #312e81; stroke: #818cf8 } .pgtop { fill: #3730a3; stroke: #818cf8 } .pgt { fill: #e0e7ff }
      .tbl { fill: #0f172a; stroke: #475569 } .tblh { fill: #1e293b } .key { fill: #fb923c }
      .sch { fill: #111827; stroke: #64748b } .scht { fill: #cbd5e1 } .file { fill: #cbd5e1 }
      .ln { stroke: #94a3b8 } .hd { fill: #94a3b8 } .ext { stroke: #a78bfa } .exth { fill: #a78bfa }
    }
  </style>
  <rect class="bg" width="1080" height="614"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="hd" d="M0 0L10 5L0 10z"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="exth" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <!-- the application -->
  <rect class="app" x="16" y="16" width="420" height="64" rx="12"/>
  <g class="ln" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="32" y="30" width="40" height="30" rx="4"/><path d="M32 39H72"/><path d="M45 46l-4 4 4 4M59 46l4 4-4 4"/>
  </g>
  <text class="t" x="86" y="42" font-size="14" font-weight="700">Your application</text>
  <text class="code" x="86" y="64" font-size="13" font-family="ui-monospace, Menlo, monospace">States.include(p =&gt; p.country)</text>

  <!-- the schema: one file, domain and infrastructure -->
  <rect class="sch" x="8" y="96" width="452" height="506" rx="14" stroke-width="1.6" stroke-dasharray="6 4"/>
    <path class="scht" d="M24 110h11l6 6v15H24z" opacity="0.15"/>
  <path d="M24 110h11l6 6v15H24zM35 110v6h6" fill="none" class="ln" stroke-width="1.5"/>
  <text class="scht" x="50" y="126" font-size="15" font-weight="700">schema</text><text class="m" x="110" y="126" font-size="12" font-family="ui-monospace, Menlo, monospace">lambdaORM.yaml</text>
  <g transform="translate(4 44)">
  <!-- domain -->
    <rect class="dom" x="16" y="98" width="420" height="250" rx="12"/>
    <g class="domi"><rect x="32" y="114" width="8" height="8" rx="2"/><rect x="44" y="114" width="8" height="8" rx="2"/><rect x="32" y="126" width="8" height="8" rx="2"/><rect x="44" y="126" width="8" height="8" rx="2"/></g>
    <text class="domt" x="62" y="131" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace">domain:</text>
    <text class="s" x="150" y="131" font-size="12">the business model, the same for both databases</text>
    <g font-size="12">
      <rect class="abs" x="32" y="146" width="388" height="44" rx="8"/>
      <text class="t" x="48" y="164" font-weight="700">Positions</text>
      <text class="m" x="404" y="164" text-anchor="end" font-size="11">abstract</text>
      <text class="s" x="48" y="181">latitude · longitude</text>
      <rect class="chip" x="32" y="214" width="186" height="118" rx="8"/>
      <text class="t" x="48" y="235" font-weight="700">Countries</text>
      <text class="s" x="48" y="256">iso3 · key</text>
      <text class="s" x="48" y="273">name · region · subregion</text>
      <text class="m" x="48" y="291" font-style="italic">states → States</text>
      <text class="m" x="48" y="318" font-size="11">+ latitude · longitude</text>
      <rect class="chip" x="234" y="214" width="186" height="118" rx="8"/>
      <text class="t" x="250" y="235" font-weight="700">States</text>
      <text class="s" x="250" y="256">id · key</text>
      <text class="s" x="250" y="273">name · countryCode</text>
      <text class="m" x="250" y="291" font-style="italic">country → Countries</text>
      <text class="m" x="250" y="318" font-size="11">+ latitude · longitude</text>
    </g>
    <g class="ext" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#e)"><path d="M125 214V192"/><path d="M327 214V192"/></g>
    <text class="m" x="226" y="206" text-anchor="middle" font-size="10">extends</text>
  
    <!-- mapping -->
    <rect class="inf" x="16" y="366" width="420" height="178" rx="12"/>
    <path class="infi" d="M32 382l9-4 9 4 9-4v15l-9 4-9-4-9 4z"/>
    <text class="inft" x="68" y="395" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace">infrastructure:</text><text class="s" x="230" y="395" font-size="12">mappings · sources · stages</text>
    <text class="s" x="32" y="418" font-size="12">mapping2: only what differs from the domain is written</text>
    <g font-size="11" font-family="ui-monospace, Menlo, monospace">
      <rect class="ichip" x="32" y="430" width="388" height="98" rx="8"/>
      <text class="t" x="48" y="452" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">States → TBL_STATES</text>
      <text class="s" x="48" y="474">id → ID</text><text class="s" x="200" y="474">countryCode → COUNTRY_CODE</text>
      <text class="s" x="48" y="492">name → NAME</text><text class="s" x="200" y="492">latitude → LATITUDE</text>
      <text class="s" x="200" y="510">longitude → LONGITUDE</text>
    </g>
  
  </g>
  <g transform="translate(14 0)">
  <!-- λORM -->
  <rect class="orm" x="476" y="196" width="196" height="166" rx="14"/>
  <circle class="ormi" cx="500" cy="221" r="13"/>
  <text x="500" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">λ</text>
  <text class="ormt" x="522" y="219" font-size="15" font-weight="700">λORM · stage1</text>
  <text class="s" x="522" y="235" font-size="11">routes each sentence</text>
  <text class="t" x="492" y="268" font-size="12" font-family="ui-monospace, Menlo, monospace">entity == "States"</text>
  <text class="s" x="504" y="286" font-size="12">→ PostgreSQL</text>
  <text class="t" x="492" y="314" font-size="12" font-family="ui-monospace, Menlo, monospace">the rest</text>
  <text class="s" x="504" y="332" font-size="12">→ MySQL</text>
  <text class="m" x="492" y="352" font-size="10">its rules: the stages of the schema</text>

  </g>

  <!-- MySQL: the classic database cylinder -->
  <g stroke-width="2">
    <path class="mysql" d="M712 62V176A54 14 0 0 0 820 176V62"/>
    <path class="ln" d="M712 100A54 14 0 0 0 820 100M712 138A54 14 0 0 0 820 138" fill="none" stroke-width="1.4" opacity="0.6"/>
    <ellipse class="mysqltop" cx="766" cy="62" rx="54" ry="14"/>
  </g>
  <text class="mysqlt" x="766" y="124" text-anchor="middle" font-size="15" font-weight="700">MySQL</text>
  <text class="s" x="766" y="214" text-anchor="middle" font-size="11">dataSource1</text>
  <text class="m" x="766" y="229" text-anchor="middle" font-size="10">mapping1: the domain names</text>
  <g font-size="12">
    <rect class="tbl" x="852" y="40" width="210" height="160" rx="8"/>
    <rect class="tblh" x="852.5" y="40.5" width="209" height="28" rx="8"/>
    <text class="t" x="868" y="59" font-weight="700">Countries</text>
    <text class="key" x="868" y="88" font-size="10" font-weight="700">PK</text><text class="t" x="894" y="88" font-weight="600">iso3</text>
    <text class="key" x="868" y="106" font-size="10" font-weight="700">UK</text><text class="t" x="894" y="106">name</text>
    <text class="t" x="894" y="124">region</text>
    <text class="t" x="894" y="142">subregion</text>
    <text class="t" x="894" y="160">latitude</text>
    <text class="t" x="894" y="178">longitude</text>
  </g>
  <path class="ln" d="M820 120H850" stroke-width="1.4" stroke-dasharray="3 3" fill="none"/>

  <!-- PostgreSQL: the classic database cylinder -->
  <g stroke-width="2">
    <path class="pg" d="M712 330V444A54 14 0 0 0 820 444V330"/>
    <path class="ln" d="M712 368A54 14 0 0 0 820 368M712 406A54 14 0 0 0 820 406" fill="none" stroke-width="1.4" opacity="0.6"/>
    <ellipse class="pgtop" cx="766" cy="330" rx="54" ry="14"/>
  </g>
  <text class="pgt" x="766" y="392" text-anchor="middle" font-size="14" font-weight="700">PostgreSQL</text>
  <text class="s" x="766" y="482" text-anchor="middle" font-size="11">dataSource2</text>
  <text class="m" x="766" y="497" text-anchor="middle" font-size="10">mapping2</text>
  <g font-size="12">
    <rect class="tbl" x="852" y="316" width="210" height="142" rx="8"/>
    <rect class="tblh" x="852.5" y="316.5" width="209" height="28" rx="8"/>
    <text class="t" x="868" y="335" font-weight="700">TBL_STATES</text>
    <text class="key" x="868" y="364" font-size="10" font-weight="700">PK</text><text class="t" x="894" y="364" font-weight="600">ID</text>
    <text class="t" x="894" y="382">COUNTRY_CODE</text>
    <text class="t" x="894" y="400">NAME</text>
    <text class="t" x="894" y="418">LATITUDE</text>
    <text class="t" x="894" y="436">LONGITUDE</text>
  </g>
  <path class="ln" d="M820 388H850" stroke-width="1.4" stroke-dasharray="3 3" fill="none"/>

  <g class="ln" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M436 48C540 48 588 110 588 194"/>
    <path d="M460 280H486"/>
    <path d="M634 196C634 130 670 120 708 120"/>
    <path d="M634 362C634 410 670 390 708 390"/>
    <path d="M440 514C560 514 640 490 708 436" stroke-dasharray="4 3"/>
  </g>
  <text class="m" x="494" y="40" font-size="10">the query</text>
  <text class="m" x="578" y="532" text-anchor="middle" font-size="10">names its tables and columns</text>
</svg>
