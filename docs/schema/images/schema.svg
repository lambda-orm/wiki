<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>A domain on one database: Countries and States on MySQL</title>
  <style>
    .bg { fill: #ffffff } .t { fill: #111827 } .s { fill: #4b5563 } .m { fill: #6b7280 }
    .app { fill: #f1f5f9; stroke: #64748b } .code { fill: #0f172a }
    .sch { fill: #f8fafc; stroke: #94a3b8 } .scht { fill: #334155 }
    .dom { fill: #eef2ff; stroke: #6366f1 } .domt { fill: #3730a3 } .chip { fill: #ffffff; stroke: #a5b4fc } .domi { fill: #6366f1 }
    .abs { fill: #ffffff; stroke: #8b5cf6; stroke-dasharray: 5 3 }
    .inf { fill: #fffbeb; stroke: #d97706 } .inft { fill: #92400e } .ichip { fill: #ffffff; stroke: #fcd34d } .infi { fill: #d97706 }
    .stgc { fill: #ffffff; stroke: #6ee7b7 } .stgt { fill: #065f46 }
    .orm { fill: #ecfdf5; stroke: #10b981 } .ormt { fill: #065f46 } .ormi { fill: #10b981 }
    .tbl { fill: #ffffff; stroke: #cbd5e1 } .tblh { fill: #f1f5f9 } .key { fill: #c2410c }
    .ln { stroke: #64748b } .hd { fill: #64748b } .ext { stroke: #8b5cf6 } .exth { fill: #8b5cf6 }
    .mysql { fill: #e0f2fe; stroke: #0369a1 } .mysqltop { fill: #bae6fd; stroke: #0369a1 } .mysqlt { fill: #075985 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a } .t { fill: #e5e7eb } .s { fill: #9ca3af } .m { fill: #9ca3af }
      .app { fill: #1e293b; stroke: #94a3b8 } .code { fill: #e2e8f0 }
      .sch { fill: #111827; stroke: #64748b } .scht { fill: #cbd5e1 }
      .dom { fill: #1e1b4b; stroke: #818cf8 } .domt { fill: #a5b4fc } .chip { fill: #0f172a; stroke: #6366f1 } .domi { fill: #818cf8 }
      .abs { fill: #0f172a; stroke: #a78bfa }
      .inf { fill: #422006; stroke: #f59e0b } .inft { fill: #fcd34d } .ichip { fill: #0f172a; stroke: #b45309 } .infi { fill: #f59e0b }
      .stgc { fill: #0f172a; stroke: #059669 } .stgt { fill: #6ee7b7 }
      .orm { fill: #064e3b; stroke: #34d399 } .ormt { fill: #6ee7b7 } .ormi { fill: #34d399 }
      .tbl { fill: #0f172a; stroke: #475569 } .tblh { fill: #1e293b } .key { fill: #fb923c }
      .ln { stroke: #94a3b8 } .hd { fill: #94a3b8 } .ext { stroke: #a78bfa } .exth { fill: #a78bfa }
      .mysql { fill: #0c4a6e; stroke: #38bdf8 } .mysqltop { fill: #075985; stroke: #38bdf8 } .mysqlt { fill: #e0f2fe }
    }
  </style>
  <rect class="bg" width="1080" height="510"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="hd" d="M0 0L10 5L0 10z"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="exth" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="app" x="16" y="16" width="436" height="64" rx="12"/>
  <g class="ln" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="32" y="30" width="40" height="30" rx="4"/><path d="M32 39H72"/><path d="M45 46l-4 4 4 4M59 46l4 4-4 4"/></g>
  <text class="t" x="86" y="42" font-size="14" font-weight="700">Your application</text>
  <text class="code" x="86" y="64" font-size="13" font-family="ui-monospace, Menlo, monospace">Countries.include(p =&gt; p.states)</text>
  <rect class="sch" x="8" y="96" width="452" height="400" rx="14" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path class="scht" d="M24 110h11l6 6v15H24z" opacity="0.15"/>
  <path d="M24 110h11l6 6v15H24zM35 110v6h6" fill="none" class="ln" stroke-width="1.5"/>
  <text class="scht" x="50" y="126" font-size="15" font-weight="700">schema</text>
  <text class="m" x="112" y="126" font-size="12" font-family="ui-monospace, Menlo, monospace">lambdaORM.yaml</text>
  <rect class="dom" x="20" y="142" width="428" height="158" rx="12"/>
  <g class="domi"><rect x="36" y="157" width="8" height="8" rx="2"/><rect x="48" y="157" width="8" height="8" rx="2"/><rect x="36" y="169" width="8" height="8" rx="2"/><rect x="48" y="169" width="8" height="8" rx="2"/></g>
  <text class="domt" x="66" y="174" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace">domain:</text>
  <text class="s" x="154" y="174" font-size="12">the business model</text>
  <rect class="chip" x="36" y="190" width="190" height="94" rx="8"/>
  <text class="t" x="52" y="211" font-size="12" font-weight="700">Countries</text>
  <text class="s" x="52" y="232" font-size="12">iso3 · key</text>
  <text class="s" x="52" y="250" font-size="12">name</text>
  <text class="m" x="52" y="268" font-size="12" font-style="italic">states → States</text>
  <rect class="chip" x="242" y="190" width="190" height="94" rx="8"/>
  <text class="t" x="258" y="211" font-size="12" font-weight="700">States</text>
  <text class="s" x="258" y="232" font-size="12">id · key</text>
  <text class="s" x="258" y="250" font-size="12">name · countryCode</text>
  <text class="m" x="258" y="268" font-size="12" font-style="italic">country → Countries</text>
  <rect class="inf" x="20" y="314" width="428" height="170" rx="12"/>
  <path class="infi" d="M36 330l9-4 9 4 9-4v15l-9 4-9-4-9 4z"/>
  <text class="inft" x="72" y="343" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace">infrastructure:</text>
  <text class="s" x="232" y="343" font-size="12">mappings · sources · stages</text>
  <rect class="ichip" x="36" y="358" width="396" height="38" rx="8"/>
  <text class="inft" x="52" y="379" font-size="12" font-weight="700">test</text>
  <text class="s" x="90.0" y="379" font-size="11">no entities: the tables take the domain names</text>
  <rect class="stgc" x="36" y="408" width="396" height="62" rx="8"/>
  <text class="stgt" x="52" y="429" font-size="12" font-weight="700">default</text>
  <text class="s" x="112.5" y="429" font-size="11">which source each entity goes to</text>
  <text class="t" x="52" y="454" font-size="12" font-family="ui-monospace, Menlo, monospace">every entity</text>
  <text class="s" x="232" y="454" font-size="12">→ test · MySQL</text>
  <rect class="orm" x="490" y="189.0" width="196" height="132" rx="14"/>
  <circle class="ormi" cx="514" cy="215.0" r="13"/>
  <text x="514" y="220.0" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">λ</text>
  <text class="ormt" x="536" y="220.0" font-size="16" font-weight="700">λORM</text>
  <text class="s" x="506" y="251.0" font-size="12">reads the schema</text>
  <text class="s" x="506" y="269.0" font-size="12">writes the SQL of MySQL</text>
  <text class="s" x="506" y="287.0" font-size="12">with the names of the domain</text>
  <text class="s" x="506" y="305.0" font-size="12">returns the countries</text>
  <g stroke-width="2">
    <path class="mysql" d="M712 178.0V292.0A54 14 0 0 0 820 292.0V178.0"/>
    <path class="ln" d="M712 216.0A54 14 0 0 0 820 216.0M712 254.0A54 14 0 0 0 820 254.0" fill="none" stroke-width="1.4" opacity="0.6"/>
    <ellipse class="mysqltop" cx="766" cy="178.0" rx="54" ry="14"/>
  </g>
  <text class="mysqlt" x="766" y="240.0" text-anchor="middle" font-size="15" font-weight="700">MySQL</text>
  <text class="s" x="766" y="330.0" text-anchor="middle" font-size="11">test</text>
  <text class="m" x="766" y="345.0" text-anchor="middle" font-size="10">mapping test</text>
  <rect class="tbl" x="872" y="160.0" width="190" height="76" rx="8"/>
  <rect class="tblh" x="872.5" y="160.5" width="189" height="28" rx="8"/>
  <text class="t" x="888" y="179.0" font-size="12" font-weight="700">Countries</text>
  <text class="key" x="888" y="208.0" font-size="10" font-weight="700">PK</text>
  <text class="t" x="914" y="208.0" font-size="12" font-weight="600">iso3</text>
  <text class="key" x="888" y="226.0" font-size="10" font-weight="700">UK</text>
  <text class="t" x="914" y="226.0" font-size="12">name</text>
  <path class="ln" d="M820 200.0H870" stroke-width="1.4" stroke-dasharray="3 3" fill="none"/>
  <rect class="tbl" x="872" y="248.0" width="190" height="94" rx="8"/>
  <rect class="tblh" x="872.5" y="248.5" width="189" height="28" rx="8"/>
  <text class="t" x="888" y="267.0" font-size="12" font-weight="700">States</text>
  <text class="key" x="888" y="296.0" font-size="10" font-weight="700">PK</text>
  <text class="t" x="914" y="296.0" font-size="12" font-weight="600">id</text>
  <text class="key" x="888" y="314.0" font-size="10" font-weight="700">FK</text>
  <text class="t" x="914" y="314.0" font-size="12">countryCode</text>
  <text class="t" x="914" y="332.0" font-size="12">name</text>
  <path class="ln" d="M820 238.0H870" stroke-width="1.4" stroke-dasharray="3 3" fill="none"/>
  <g class="ln" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M452 48C540 48 588 109.0 588 187.0"/>
    <path d="M460 255.0H488"/>
    <path d="M686 236.0H708"/>
  </g>
  <text class="m" x="500" y="40" font-size="10">the query</text>
  <text class="m" x="464" y="247.0" font-size="10">reads</text>
</svg>
