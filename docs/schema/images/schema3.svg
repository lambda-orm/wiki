  <text class="s" x="105.0" y="483" font-size="11">which source each entity goes to</text>
  <text class="t" x="52" y="508" font-size="12" font-family="ui-monospace, Menlo, monospace">every entity</text>
  <text class="s" x="232" y="508" font-size="12">→ source1 · MySQL</text>
  <rect class="stgc" x="36" y="536" width="396" height="62" rx="8"/>
  <text class="stgt" x="52" y="557" font-size="12" font-weight="700">stage2</text>
  <text class="s" x="105.0" y="557" font-size="11">which source each entity goes to</text>
  <text class="t" x="52" y="582" font-size="12" font-family="ui-monospace, Menlo, monospace">every entity</text>
  <text class="s" x="232" y="582" font-size="12">→ source2 · PostgreSQL</text>
  <rect class="orm" x="490" y="253.0" width="196" height="132" rx="14"/>
  <circle class="ormi" cx="514" cy="279.0" r="13"/>
