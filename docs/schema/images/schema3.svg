  <text class="t" x="838" y="106" font-size="12" font-weight="600">id</text>
  <text class="srct" x="812" y="124" font-size="10" font-weight="700">FK</text>
  <text class="t" x="838" y="124" font-size="12">countryCode</text>
  <text class="t" x="838" y="142" font-size="12">name</text>
