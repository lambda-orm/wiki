<svg xmlns="http://www.w3.org/2000/svg" width="980" height="376" viewBox="0 0 980 376" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Two stages: the same domain on MySQL and on PostgreSQL, each with its mapping</title>

  <style>
