<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="638" viewBox="0 0 1080 638" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Two stages: the same domain on MySQL and on PostgreSQL, each with its mapping</title>
  <style>
    .bg { fill: #ffffff } .t { fill: #111827 } .s { fill: #4b5563 } .m { fill: #6b7280 }
