  <text class="s" x="232" y="421" font-size="11" font-family="ui-monospace, Menlo, monospace">countryCode → COUNTRY_CODE</text>
  <text class="s" x="52" y="437" font-size="11" font-family="ui-monospace, Menlo, monospace">id → ID</text>
  <text class="s" x="232" y="437" font-size="11" font-family="ui-monospace, Menlo, monospace">name → NAME</text>
  <rect class="stgc" x="36" y="462" width="396" height="62" rx="8"/>
