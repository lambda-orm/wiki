<svg xmlns="http://www.w3.org/2000/svg" width="980" height="414" viewBox="0 0 980 414" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Extending an abstract entity: Countries and States take the position of Positions</title>

  <style>
