site_name: λORM Wiki
docs_dir: docs
site_dir: wiki
site_url: https://lambda-orm.github.io/wiki/
use_directory_urls: true
theme:
  name: readthedocs
  # code as in VS Code / Monaco (dark): assets/wiki-v2.css sets the font, assets/wiki-v2.js colours the scripts inside `…`
  hljs_style: vs2015
extra_css:
  # a new name when they change: a browser never mixes a cached old one with the new pages
  - assets/wiki-v2.css
extra_javascript:
  - assets/wiki-v2.js
markdown_extensions:
  - toc:
      permalink: false
      toc_depth: 2

nav:
  - Home: index.html
  - Features: Features
  - Cli: cli
  - Labs: labs
  - Data Gateway:
      - Overview: data-gateway/index.md
      - Getting started: data-gateway/GettingStarted.md
      - Configuration: data-gateway/Configuration.md
      - Transports: data-gateway/Transports.md
      - REST API: data-gateway/Rest.md
      - MCP: data-gateway/Mcp.md
      - WebSocket API: data-gateway/WebSocket.md
      - Security: data-gateway/Security.md
      - UI: data-gateway/Ui.md
      - Clients: data-gateway/Clients.md
      - Operations: data-gateway/Operations.md
      - Change log: data-gateway/CHANGELOG.md
  - Queries:
      - Query Language: queries/Query-Language
      - Expression: queries/Expression
      - Select: queries/Select
      - Join: queries/Join
      - Grouping: queries/Grouping
      - Include: queries/Include
      - Insert: queries/Insert
      - Bulk Insert: queries/BulkInsert
      - Update: queries/Update
      - Delete: queries/Delete
      - Operators & Functions: queries/operatorsAndFunctions/OperatorsAndFunctions   
  - Schema:
      - Definition: schema/SchemaDefinition
      - Expressions: schema/SchemaDefinition-Expressions
      - Environment Variables: schema/SchemaDefinition-EnvironmentVariables
      - Composite: schema/SchemaDefinition-Composite
      - Listeners: schema/SchemaExample-Listener
      - Basic:  schema/SchemaExample-Basic
      - Extend Entity:  schema/SchemaExample-Extend
      - Multiples Stages:  schema/SchemaExample-MultiplesStages
      - Stage with Multiples Sources:  schema/SchemaExample-StageMultiplesSources
      - Entity Composite:  schema/SchemaExample-Composite
      - Push: schema/SchemaSynchronization-Push
      - Pull: schema/SchemaSynchronization-Pull
      - Fetch: schema/SchemaSynchronization-Fetch
      - Introspect: schema/SchemaSynchronization-Introspect
      - Incorporate: schema/SchemaSynchronization-Incorporate
      - Use: schema/Schema-Use
      - Engines: schema/Engines
  - Usage:     
    - Repository: usage/Repository
    - Transaction: usage/Transaction
    - Script: usage/Script
    - Usage: usage/Usage
    - Change log: usage/CHANGELOG