site_name: λORM Wiki
site_description: λORM — an ORM of lambda queries over several databases, and the Data Gateway that publishes its schemas
docs_dir: docs
site_dir: wiki
site_url: https://lambda-orm.github.io/wiki/
use_directory_urls: true

theme:
  name: readthedocs
  # the language selector (overrides/main.html)
  custom_dir: overrides
  # code as in VS Code / Monaco (dark): assets/wiki-v4.css sets the font, assets/wiki-v2.js colours the scripts inside `…`
  hljs_style: vs2015
  # the side menu lists the pages only, not the headings of the current page: they are in the page
  titles_only: true

extra_css:
  # a new name when they change: a browser never mixes a cached old one with the new pages
  - assets/wiki-v5.css
extra_javascript:
  - assets/wiki-v3.js
  # the downloads of the IDE (docs/ide/Download.md): GitHub releases ide-v*, read by the browser
  - assets/downloads-v1.js

plugins:
  - search
  # the guide of the IDE, first in the Data Gateway tab and then one page of its own, is now its pages: the old
  # addresses take to the overview, which lists them
  - redirects:
      redirect_maps:
        data-gateway/Ui.md: ide/index.md
        es/data-gateway/Ui.md: https://lambda-orm.github.io/wiki/es/ide/
        pt/data-gateway/Ui.md: https://lambda-orm.github.io/wiki/pt/ide/
        de/data-gateway/Ui.md: https://lambda-orm.github.io/wiki/de/ide/
        ide/Guide.md: ide/index.md
        es/ide/Guide.md: https://lambda-orm.github.io/wiki/es/ide/
        pt/ide/Guide.md: https://lambda-orm.github.io/wiki/pt/ide/
        de/ide/Guide.md: https://lambda-orm.github.io/wiki/de/ide/
  - i18n:
      # a translation is next to its page: GettingStarted.md, GettingStarted.de.md, GettingStarted.es.md, GettingStarted.pt.md
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_search: true
      languages:
