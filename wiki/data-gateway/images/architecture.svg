<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Data Gateway: supervisor, edge worker and schema workers</title>
  <rect width="960" height="470" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <!-- supervisor -->
  <rect x="300" y="16" width="360" height="74" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="42" text-anchor="middle" font-size="16" font-weight="700">Supervisor (main thread)</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#4b5563">reads the configuration · starts and watches the workers</text>
  <text x="480" y="78" text-anchor="middle" font-size="12" fill="#4b5563">heartbeat · restarts · states · no network, no queries</text>
  <!-- edge -->
  <rect x="40" y="140" width="330" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="205" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Edge worker</text>
  <g font-size="12">
    <rect x="60" y="180" width="140" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="130" y="200" text-anchor="middle">http :8080</text>
    <rect x="210" y="180" width="140" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="280" y="200" text-anchor="middle">mcpHttp :8081</text>
    <rect x="60" y="218" width="140" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="130" y="238" text-anchor="middle">mcpWebSocket :8082</text>
    <rect x="210" y="218" width="140" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="280" y="238" text-anchor="middle">webSocket :8083</text>
    <text x="205" y="274" text-anchor="middle" fill="#374151">1 · authenticate the credential</text>
    <text x="205" y="292" text-anchor="middle" fill="#374151">2 · rate limit · simultaneous operations</text>
    <text x="205" y="310" text-anchor="middle" fill="#374151">3 · find the schema by the route</text>
    <text x="205" y="328" text-anchor="middle" fill="#374151">(the secret never leaves the edge)</text>
  </g>
  <!-- schema workers -->
  <g font-size="12">
    <rect x="560" y="130" width="360" height="92" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="740" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Schema worker · iot/v1</text>
    <text x="740" y="174" text-anchor="middle" fill="#374151">4 · authorize (permissions) · 5 · λORM runs the query</text>
    <text x="740" y="192" text-anchor="middle" fill="#374151">its env · its connection pools · its queue · its MCP tools</text>
    <text x="740" y="210" text-anchor="middle" fill="#374151">6 · audit the writes</text>
    <rect x="560" y="236" width="360" height="56" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="740" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Schema worker · iot/v2</text>
    <text x="740" y="280" text-anchor="middle" fill="#374151">thread or process · restarted alone if it falls</text>
    <rect x="560" y="306" width="360" height="56" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="740" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Schema worker · accounts (error)</text>
    <text x="740" y="350" text-anchor="middle" fill="#374151">database down → 503 · retried with a growing wait</text>
  </g>
  <!-- databases -->
  <g font-size="12">
    <rect x="600" y="404" width="130" height="40" rx="8" fill="#fff7ed" stroke="#f97316"/><text x="665" y="429" text-anchor="middle" font-weight="600">PostgreSQL</text>
    <rect x="750" y="404" width="130" height="40" rx="8" fill="#fff7ed" stroke="#f97316"/><text x="815" y="429" text-anchor="middle" font-weight="600">MongoDB</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M380 90L250 138" stroke-dasharray="5 4" marker-end="url(#b)"/>
    <path d="M580 90L700 128" stroke-dasharray="5 4" marker-end="url(#b)"/>
    <path d="M372 200H558" marker-end="url(#b)"/>
    <path d="M372 240C460 240 470 264 558 264" marker-end="url(#b)"/>
    <path d="M372 300C460 300 470 334 558 334" marker-end="url(#b)"/>
    <path d="M665 362V402" marker-end="url(#b)"/>
    <path d="M815 362V402" marker-end="url(#b)"/>
  </g>
  <text x="465" y="190" text-anchor="middle" font-size="11" fill="#6b7280">a direct channel per schema</text>
  <text x="480" y="112" text-anchor="middle" font-size="11" fill="#6b7280">starts · watches · restarts</text>
  <text x="740" y="392" text-anchor="middle" font-size="11" fill="#6b7280">each worker, its own pools</text>
  <text x="40" y="380" font-size="12" fill="#374151">A client: a credential with read can query, never write — by any transport.</text>
  <text x="40" y="400" font-size="12" fill="#374151">A heavy query on iot/v1 doesn't stop iot/v2; a fallen worker is restarted alone.</text>
</svg>
